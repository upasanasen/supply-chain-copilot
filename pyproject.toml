[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-copilot"
version = "1.1.0"
description = "A grounded LLM agent for supply-chain risk analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Upasana Sen" }]
keywords = ["supply-chain", "llm-agent", "risk-analysis", "ai-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
agent = ["anthropic>=0.40,<1"]
dev = ["build>=1,<2", "pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
supply-chain-copilot = "copilot.cli:main"

[project.urls]
Repository = "https://github.com/upasanasen/supply-chain-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/supply-chain-copilot/data/processed" = [
    "data/processed/prices_quarterly.csv",
    "data/processed/wind_daily.csv",
]
"share/supply-chain-copilot/data/synthetic" = ["data/synthetic/network.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
